<!DOCTYPE html>
<html lang="es-MX">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página No Encontrada — Rotulate Publicidad</title>
    <meta name="description" content="Ups, esta página no existe. Regresa al inicio de Rotulate Publicidad en Cancún.">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Google Tag Manager -->
    <script src="/gtm.js" async></script>

    <!-- Space Grotesk Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap">

    <!-- Preload background images -->
    <link rel="preload" as="image" href="/assets/hero-space-bg-earth.jpg" media="(min-width: 969px)" type="image/jpeg">
    <link rel="preload" as="image" href="/assets/hero-space-bg-mobile.jpg" media="(max-width: 968px)" type="image/jpeg">

    <style>
        /* ===== RESET & BASE ===== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --color-dark: #000624;
            --color-accent-lime: #00ff00;
            --color-accent-orange: #ff6b2b;
            --color-text: #ffffff;
            --color-text-muted: rgba(255,255,255,0.70);
            --font-main: 'Space Grotesk', system-ui, sans-serif;
        }

        html, body {
            height: 100%;
            font-family: var(--font-main);
            background: var(--color-dark);
            color: var(--color-text);
            overflow-x: hidden;
        }

        /* ===== PAGE WRAPPER ===== */
        .page-404 {
            position: relative;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ===== BACKGROUND ===== */
        .bg-404 {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .bg-404 picture,
        .bg-404 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* Subtle overlay so text is always readable, but space stays vivid */
        .bg-404::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(0, 6, 36, 0.62) 0%,
                rgba(0, 6, 36, 0.40) 50%,
                rgba(0, 6, 36, 0.55) 100%
            );
        }

        /* ===== HEADER / LOGO ===== */
        .header-404 {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            margin-bottom: clamp(1.5rem, 3.5vw, 2.5rem);
        }

        .logo-404 img {
            height: clamp(42px, 7vw, 77px);
            width: auto;
            display: block;
            filter: drop-shadow(0 2px 12px rgba(0,0,0,0.5));
        }

        /* ===== MAIN CONTENT ===== */
        .content-404 {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem 4rem;
        }

        .inner-404 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
            max-width: 1100px;
            width: 100%;
        }

        /* ===== TEXT COLUMN ===== */
        .text-col {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 1.2rem;
        }

        .error-code {
            font-size: clamp(0.8rem, 1.5vw, 1rem);
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--color-accent-lime);
            background: rgba(0, 255, 0, 0.12);
            border: 1px solid rgba(0, 255, 0, 0.30);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            display: inline-block;
        }

        .title-404 {
            font-family: var(--font-main);
            font-size: clamp(5.5rem, 11vw, 9rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--color-accent-orange);
            text-shadow:
                0 0 60px rgba(255, 107, 43, 0.30),
                0 4px 30px rgba(0,0,0,0.6);
        }

        .title-404 span {
            color: var(--color-accent-orange);
        }

        .subtitle-404 {
            font-family: var(--font-main);
            font-size: clamp(1.3rem, 2.5vw, 1.9rem);
            font-weight: 600;
            line-height: 1.25;
            color: #ffffff;
            text-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }

        .body-404 {
            font-family: var(--font-main);
            font-size: clamp(0.95rem, 1.5vw, 1.1rem);
            line-height: 1.7;
            color: var(--color-text-muted);
            max-width: 420px;
        }

        /* ===== CTA BUTTON ===== */
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-family: var(--font-main);
            font-size: 1rem;
            font-weight: 700;
            color: #000;
            background: var(--color-accent-lime);
            padding: 0.9rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            letter-spacing: 0.01em;
            margin-top: 0.5rem;
            box-shadow:
                0 4px 20px rgba(0, 255, 0, 0.40),
                0 1px 4px rgba(0,0,0,0.3);
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .btn-home:hover,
        .btn-home:focus-visible {
            background: #33ff33;
            transform: translateY(-3px);
            box-shadow:
                0 8px 28px rgba(0, 255, 0, 0.55),
                0 2px 8px rgba(0,0,0,0.3);
            outline: none;
        }

        .btn-home svg {
            transition: transform 0.2s ease;
        }

        .btn-home:hover svg {
            transform: translateX(-4px);
        }

        /* ===== ASTRONAUT COLUMN ===== */
        .astro-col {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .astronaut-404 {
            width: clamp(260px, 38vw, 440px);
            height: auto;
            display: block;
            filter: drop-shadow(0 20px 60px rgba(0, 0, 0, 0.55));
            animation: floatAstronaut404 4.5s ease-in-out infinite;
            transform-origin: center center;
        }

        /* ===== FLOAT ANIMATION ===== */
        @keyframes floatAstronaut404 {
            0%   { transform: translateY(0px) rotate(-2deg); }
            50%  { transform: translateY(-22px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(-2deg); }
        }

        /* ===== STARS DECORATION ===== */
        .stars-404 {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: white;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50%       { opacity: 1;   transform: scale(1.4); }
        }

        /* ===== MOBILE ===== */
        @media (max-width: 768px) {
            .inner-404 {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 0;
            }

            .text-col {
                align-items: center;
                order: 2;
            }

            .header-404 {
                justify-content: center;
                margin-bottom: 1.5rem;
            }

            .astro-col {
                order: 1;
                padding-bottom: 1rem;
            }

            .astronaut-404 {
                width: clamp(180px, 60vw, 260px);
            }

            .body-404 {
                max-width: 100%;
            }

            .title-404 {
                font-size: clamp(4.5rem, 18vw, 6rem);
            }

            .subtitle-404 {
                font-size: clamp(1.1rem, 4.5vw, 1.4rem);
            }
        }

        @media (max-width: 480px) {
            .content-404 {
                padding: 1rem 1rem 3rem;
            }
        }
    </style>
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5623CPQG"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <div class="page-404">

        <!-- Background -->
        <div class="bg-404" aria-hidden="true">
            <picture>
                <source media="(max-width: 968px)" srcset="/assets/hero-space-bg-mobile.jpg" type="image/jpeg">
                <source media="(min-width: 969px)" srcset="/assets/hero-space-bg-earth.jpg" type="image/jpeg">
                <img src="/assets/hero-space-bg-earth.jpg" alt="" width="1600" height="900" fetchpriority="high">
            </picture>
        </div>

        <!-- Floating stars layer -->
        <div class="stars-404" id="stars-404" aria-hidden="true"></div>

        <!-- Main content -->
        <main class="content-404" id="main-content">
            <div class="inner-404">

                <!-- Text column -->
                <div class="text-col">
                    <header class="header-404">
                        <a href="/" class="logo-404" aria-label="Ir al inicio — Rotulate Publicidad">
                            <img src="/assets/logo-rotulate.png" alt="Rotulate Publicidad" width="160" height="48">
                        </a>
                    </header>

                    <span class="error-code">Error 404</span>

                    <h1 class="title-404">¡Upps<span>!</span></h1>

                    <p class="subtitle-404">Nos alejamos de la nave&hellip;</p>

                    <p class="body-404">
                        Aquí no vas a encontrar lo que buscabas.<br>
                        Esta página no existe o fue movida a otra coordenada del universo.
                    </p>

                    <a href="/" class="btn-home">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M19 12H5M12 5l-7 7 7 7"/>
                        </svg>
                        Regresar al inicio
                    </a>
                </div>

                <!-- Astronaut column -->
                <div class="astro-col">
                    <img
                        src="/assets/astronauta-corazon.png"
                        alt="Astronauta flotando en el espacio"
                        class="astronaut-404"
                        width="440"
                        height="520"
                        fetchpriority="high"
                    >
                </div>

            </div>
        </main>
    </div>

    <script>
        // Generate twinkling stars
        (function() {
            const container = document.getElementById('stars-404');
            if (!container) return;
            const count = 55;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.5 + 0.8;
                star.style.cssText = [
                    `width:${size}px`,
                    `height:${size}px`,
                    `left:${Math.random() * 100}%`,
                    `top:${Math.random() * 100}%`,
                    `animation-delay:${(Math.random() * 4).toFixed(2)}s`,
                    `animation-duration:${(Math.random() * 3 + 2).toFixed(2)}s`
                ].join(';');
                container.appendChild(star);
            }
        })();
    </script>
</body>

</html>
