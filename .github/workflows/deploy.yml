name: Deploy to Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hostinger-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate and build public artifact
        run: |
          node --test scripts/build-deploy.test.mjs scripts/security-monitor.test.mjs
          echo "DEPLOY_DIR=$(node scripts/build-deploy.mjs)" >> "$GITHUB_ENV"
      - name: Setup SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          cp .github/known_hosts ~/.ssh/known_hosts
      - name: Deploy public artifact over SSH
        run: |
          for i in 1 2 3 4 5 6; do
            if rsync -avz --chmod=D755,F644 \
              -e "ssh -p 65002 -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20" \
              "$DEPLOY_DIR/" u944947843@157.173.209.165:domains/rotulatepublicidad.com/public_html/; then
              echo "Deploy exitoso en el intento $i"
              exit 0
            fi
            sleep 30
          done
          exit 1
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
