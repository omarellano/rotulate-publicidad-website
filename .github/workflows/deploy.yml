name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SFTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List local files
        run: find . -not -path './.git/*' -not -path './.github/*' | sort

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "[157.173.209.165]:65002 ssh-rsa " >> ~/.ssh/known_hosts
          echo "[157.173.209.165]:65002 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBBwUIwwRwS3/HsLYHimZ87m5orHtvlZDbNzu+iZpPpVni+7FFMCRaGuvnX1Zrd222vJaK1vie3Aujc3wmSAEyqo=" >> ~/.ssh/known_hosts
          echo "[157.173.209.165]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGMEdxwrS1c2Jv3nW63liD8H71IvUCHEPEaffhfSYQYW" >> ~/.ssh/known_hosts

      - name: Deploy via rsync over SSH
        run: |
          # Hostinger bloquea intermitentemente las IPs de GitHub: reintentar
          # hasta 6 veces con ConnectTimeout corto en lugar de fallar al primero
          for i in 1 2 3 4 5 6; do
            if rsync -avz \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='README.md' \
              --exclude='CLAUDE.md' \
              --exclude='.gitignore' \
              --exclude='LICENSE' \
              --exclude='search_info' \
              --exclude='seo_performance' \
              --exclude='deploy_failures' \
              --exclude='assets/ysisi' \
              --exclude='assets/nuevas_fotos' \
              --exclude='assets/galeria-raw' \
              --exclude='assets/imagenes_blog' \
              --exclude='scratch' \
              --exclude='docs' \
              --exclude='assets/hero-space-bg.png' \
              --exclude='assets/hero-space-bg-2.png' \
              --exclude='assets/hero-space-bg-3.png' \
              -e "ssh -p 65002 -i ~/.ssh/deploy_key -o ConnectTimeout=20" \
              . u944947843@157.173.209.165:domains/rotulatepublicidad.com/public_html/; then
              echo "Deploy exitoso en el intento $i"
              exit 0
            fi
            echo "Intento $i falló; esperando 30s antes de reintentar..."
            sleep 30
          done
          echo "Deploy falló tras 6 intentos"
          exit 1

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
