name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SFTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List local files
        run: find . -not -path './.git/*' -not -path './.github/*' | sort

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "[157.173.209.165]:65002 ssh-rsa " >> ~/.ssh/known_hosts
          echo "[157.173.209.165]:65002 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBBwUIwwRwS3/HsLYHimZ87m5orHtvlZDbNzu+iZpPpVni+7FFMCRaGuvnX1Zrd222vJaK1vie3Aujc3wmSAEyqo=" >> ~/.ssh/known_hosts
          echo "[157.173.209.165]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGMEdxwrS1c2Jv3nW63liD8H71IvUCHEPEaffhfSYQYW" >> ~/.ssh/known_hosts

      - name: Deploy via rsync over SSH
        run: |
          rsync -avz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='CLAUDE.md' \
            --exclude='.gitignore' \
            --exclude='LICENSE' \
            -e "ssh -p 65002 -i ~/.ssh/deploy_key" \
            . u944947843@157.173.209.165:domains/rotulatepublicidad.com/public_html/

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
